<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT Enhanced</title>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">YOUR CHATGPT, PERSONALIZED</p>
        <h1>ChatGPT Enhanced</h1>
        <p id="version" class="muted"></p>
      </header>
      <fieldset id="features" disabled>
        <legend>Features</legend>
        <label class="feature">
          <span><strong>Project Colors</strong><small>Color highlights for your projects.</small></span>
          <input type="checkbox" id="projectColors" aria-describedby="foundation-note" />
        </label>
        <label class="feature">
          <span><strong>Chat Colors</strong><small>Color highlights for individual chats.</small></span>
          <input type="checkbox" id="chatColors" aria-describedby="foundation-note" />
        </label>
        <label class="feature">
          <span><strong>Codex Cloud Colors</strong><small>Color highlights for individual Codex cloud tasks.</small></span>
          <input type="checkbox" id="codexCloudColors" aria-describedby="foundation-note" />
        </label>
        <label class="feature">
          <span><strong>Chat Navigation</strong><small>Search and jump between rendered questions.</small></span>
          <input type="checkbox" id="chatNavigation" aria-describedby="foundation-note" />
        </label>
      </fieldset>
      <fieldset id="history-backup" disabled>
        <legend>历史导航备份</legend>
        <label class="feature"><span><strong>本地备份问题目录</strong><small>仅在本机保存问题预览和标识；最多 8 个会话，每个 300 条。不保存助手回答。</small></span><input type="checkbox" id="navigationBackup" /></label>
        <button type="button" id="clear-navigation-backup">关闭并清除所有目录备份</button>
      </fieldset>
      <p id="backup-status" role="status" aria-live="polite"></p>
      <p id="foundation-note" class="note">开启颜色功能后，在侧边栏项目、聊天或 Codex 云端任务行直接右键选色，无需按组合键。三点按钮保持原有功能。开启 Chat Navigation 可在会话左侧查看问题导航；空间不足时自动隐藏。</p>
      <p id="status" role="status" aria-live="polite">Loading preferences…</p>
      <button type="button" id="check-page">检查当前页</button>
      <p id="page-status" role="status" aria-live="polite"></p>
      <footer>问题目录默认仅在页面内存中。启用备份后，问题预览保存在本机，可随时清除。</footer>
    </main>
  </body>
</html>
